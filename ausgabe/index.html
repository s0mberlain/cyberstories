/* Layout: schwarze Kopfleiste wie auf den Karten, darunter Übersicht als Kartenraster
   oder Spielansicht mit großer Karte links und Bedienfeld rechts. Ein festes Erscheinungsbild:
   Papierweiß, Tinte, Signalrot, wie das gedruckte Deck. */
:root {
  --paper: #ffffff;
  --ink: #111111;
  --red: #d7191c;
  --mute: #5f5b5b;
  --line: #d9d4d4;
  --wash: #f4f1f1;
  --dots: rgba(17, 17, 17, .22);
  --display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.top { background: var(--ink); color: #fff; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-in { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1400px; margin: 0 auto; }
.brand { font-family: var(--mono); font-weight: 700; letter-spacing: .28em; font-size: 14px; background: none; border: 0; cursor: pointer; padding: 4px 0; }
.brand span { color: var(--red); }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button { background: none; border: 1px solid transparent; color: #cfcaca; font-family: var(--mono); font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase; padding: 8px 12px; border-radius: 2px; cursor: pointer; }
.nav button[aria-current="true"] { color: #fff; border-color: #fff; }
.nav button:hover { color: #fff; }

main { max-width: 1400px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); margin: 0 0 6px; }
h1.page { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4vw, 44px); letter-spacing: -.02em; line-height: 1.05; margin: 0; text-wrap: balance; }
.rule { width: 48px; height: 4px; background: var(--red); margin: 14px 0 0; }

/* Übersicht */
.filters { display: flex; flex-wrap: wrap; gap: 20px 32px; margin: 26px 0 22px; align-items: flex-end; }
.fgroup { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fgroup > span { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--paper); border: 1.5px solid var(--ink); padding: 6px 12px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 2px; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip:hover { border-color: var(--red); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--ink); background: var(--paper);
  padding: 10px 16px; font-weight: 600; font-size: 15px; cursor: pointer; border-radius: 2px; }
.btn:hover { border-color: var(--red); }
.btn.solid { background: var(--ink); color: #fff; }
.btn.solid:hover { background: var(--red); border-color: var(--red); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.red:hover { background: var(--ink); border-color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; border-color: var(--ink); }
.count-note { font-size: 14px; color: var(--mute); margin: 0 0 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.tile { position: relative; text-align: left; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 4px;
  padding: 0; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; transition: transform .12s ease; }
.tile:hover { transform: translateY(-2px); border-color: var(--red); }
.tile-bar { background: var(--ink); color: #fff; display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; padding: 6px 10px; }
.tile-bar b { color: var(--red); font-weight: 700; }
.tile .art { height: 120px; }
.tile-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.tile-title { font-weight: 800; font-size: 16px; line-height: 1.2; text-wrap: balance; }
.tile-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; gap: 8px; }
.played { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
.tile.is-played .art svg { opacity: .45; }

.art { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background-image: radial-gradient(circle, var(--dots) 1.1px, transparent 1.4px); background-size: 12px 12px; }
.art svg { position: relative; height: 82%; width: auto; aspect-ratio: 1; max-width: 100%; background: var(--paper); border-radius: 50%; padding: 4px; }
.art::before, .art::after { content: ""; position: absolute; width: 14px; height: 14px; border: 0 solid var(--red); }
.art::before { top: 6px; left: 6px; border-width: 2.5px 0 0 2.5px; }
.art::after { bottom: 6px; right: 6px; border-width: 0 2.5px 2.5px 0; }
svg .k { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
svg .r { fill: none; stroke: var(--red); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
svg .w { fill: var(--paper); }
svg .kf { fill: var(--ink); } svg .rf { fill: var(--red); }
svg .mono { font-family: var(--mono); font-weight: 700; }
svg .sans { font-family: var(--display); fill: var(--ink); }
svg text.red { fill: var(--red); }

.stars { display: inline-flex; gap: 3px; align-items: center; }
.stars i { width: 9px; height: 9px; background: var(--red); display: block; }
.stars i.off { background: var(--line); }
.stars em { font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-left: 6px; color: var(--mute); }

/* Spielansicht */
.play { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 28px; align-items: start; margin-top: 18px; }
.backrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 6px 0; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; color: var(--mute); }
.linkbtn:hover { color: var(--red); }
.bigcard { border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--paper); min-width: 0; }
.bigcard .tile-bar { font-size: 13px; padding: 10px 18px; }
.bigcard .tile-bar b { font-size: 16px; }
.bigcard .art { height: clamp(180px, 28vh, 300px); margin: 18px 18px 0; border: 1.5px solid var(--ink); }
.bigcard-body { padding: 22px clamp(18px, 3vw, 36px) 30px; }
.bigcard h2 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.riddle { font-size: clamp(19px, 1.9vw, 28px); line-height: 1.45; margin: 18px 0 0; max-width: 46ch; }
.riddle p { margin: 0 0 .6em; }

.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.box { border: 1.5px solid var(--ink); border-radius: 4px; padding: 16px; background: var(--paper); }
.box-h { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin: 0 0 10px;
  display: flex; justify-content: space-between; gap: 8px; }
.counter { display: flex; align-items: center; gap: 12px; }
.counter .num { font-family: var(--mono); font-weight: 700; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: center; }
.counter .btn { min-width: 52px; font-size: 22px; padding: 8px 12px; }
.counter .btn.plus { flex: 1; font-size: 16px; }
.timer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer .num { font-family: var(--mono); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.timer .num.warn { color: var(--red); }
.timer .btns { display: flex; gap: 6px; margin-left: auto; }
.tips { display: flex; flex-direction: column; gap: 10px; }
.tip { border-left: 4px solid var(--ink); padding: 6px 0 6px 12px; font-size: 17px; }
.tip-label { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--red); display: block; margin-bottom: 2px; }
.tipbtn { justify-content: space-between; width: 100%; }

.solution { margin-top: 28px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.solution .tile-bar { background: var(--red); padding: 10px 18px; font-size: 13px; }
.solution .tile-bar b { color: #fff; }
.sol-body { padding: 24px clamp(18px, 3vw, 36px) 28px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; }
.sol-text { font-size: clamp(17px, 1.5vw, 22px); line-height: 1.5; }
.sol-text p { margin: 0 0 .7em; }
.merk { border-left: 6px solid var(--red); padding: 4px 0 4px 16px; font-weight: 600; font-size: clamp(17px, 1.5vw, 22px); line-height: 1.4; }
.merk .tip-label { margin-bottom: 6px; }
.talk { margin-top: 22px; }
.talk ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 6px; font-size: 17px; }
.peek { background: var(--wash); border: 1.5px dashed var(--ink); border-radius: 4px; padding: 14px; font-size: 15px; }
.peek p { margin: 0 0 .5em; }
.hint-keys { font-size: 13px; color: var(--mute); line-height: 1.6; }
kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; padding: 1px 6px; border-radius: 3px; background: var(--wash); color: var(--ink); }
.navrow { display: flex; gap: 8px; flex-wrap: wrap; }
.navrow .btn { flex: 1; }

/* Regeln */
.rules { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 36px; margin-top: 28px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; }
.steps li::before { content: counter(s); font-family: var(--mono); font-weight: 700; font-size: 20px; background: var(--ink); color: #fff;
  height: 44px; display: flex; align-items: center; justify-content: center; }
.steps b { display: block; font-size: 18px; }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.answers div { border: 1.5px solid var(--ink); padding: 10px 12px; font-weight: 700; }
.answers div span { display: block; font-weight: 400; font-size: 14px; color: var(--mute); }
.prose { max-width: 62ch; }
.prose p { margin: 0 0 .8em; }

@media (max-width: 900px) {
  .play, .rules, .sol-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile .art { height: 96px; }
  .tile-title { font-size: 14px; }
  .nav button { padding: 6px 8px; letter-spacing: .08em; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.reveal { animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
.lang { display: flex; border: 1px solid #5c5757; border-radius: 2px; overflow: hidden; }
.lang button { background: none; border: 0; color: #cfcaca; font-family: var(--mono); font-size: 12px; letter-spacing: .12em; padding: 7px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: #fff; color: var(--ink); }
.lang button:hover { color: #fff; }
.lang button[aria-pressed="true"]:hover { color: var(--ink); }
.fallback { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  border: 1.5px solid var(--red); color: var(--red); padding: 4px 8px; margin: 0 0 12px; }
.tile .fallback { font-size: 9px; padding: 2px 5px; margin: 0; }
</style>
</head>

  <div class="top-in">
    <button class="brand" id="home" type="button">CYBER<span>STORIES</span></button>
    <nav class="nav" aria-label="Navigation">
      <button type="button" id="nav-cards" data-view="cards"></button>

    <div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" id="lang-de" data-lang="de">DE</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </div>
</header>

t=\"28\"/><text x=\"92\" y=\"31\" class=\"mono\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\">pw:<\/text><\/g>", "de": {"titel": "Die stille Kündigung", "thema": "Passwörter, Innentäter", "raetsel": "Ein Mitarbeiter kommt morgens ins Werk, doch sein Ausweis öffnet keine Tür mehr und sein Firmenkonto ist gesperrt. Gekündigt hat ihm niemand, und doch ist er digital „verschwunden“.", "tipps": ["Ein Kollege steckt dahinter, aus persönlichen Gründen.", "Das Personalsystem steuert automatisch Ausweise und Konten."], "loesung": "Ein neidischer Kollege hatte das Passwort des Mitarbeiters auf einem Post-it am Monitor gefunden. Damit meldete er sich im Personalsystem an, trug den Kollegen als ausgeschieden ein und löste so automatisch die Sperrung von Ausweis und Konto aus.", "merksatz": "Ein Passwort am Monitor ist ein Passwort für alle. Wer das Konto eines anderen nutzt, handelt in dessen Namen."}, "en": {"titel": "The Silent Dismissal", "thema": "Passwords, insider", "raetsel": "An employee arrives at the plant in the morning, but his badge no longer opens any doors and his company account is locked. Nobody has fired him, yet he has digitally “disappeared”.", "tipps": ["A colleague is behind it, for personal reasons.", "The HR system automatically controls badges and accounts."], "loesung": "An envious colleague had found the employee's password on a sticky note on his monitor. He used it to log into the HR system and recorded the employee as having left the company. That automatically triggered the blocking of his badge and account.", "merksatz": "A password on your monitor is a password for everyone. Whoever uses someone else's account acts in their name."}}, {"nr": 4, "stufe": "schwer", "abteilungen": ["fuehrung"], "bild": "<metadata><c2pa:

2 64 v10\"/><circle class=\"rf\" cx=\"62\" cy=\"80\" r=\"2\"/>", "de": {"titel": "Die falsche Einladung", "thema": "Phishing, KI, Deepfake", "raetsel": "Mehrere Ingenieure erscheinen nicht zum wöchentlichen Jour fixe. Stattdessen sitzen sie in einem anderen Online-Meeting, in dem ihr „Teamleiter“ ungewöhnlich viele Fragen zu Projektdetails stellt.", "tipps": ["Die Einladung kam nicht vom Teamleiter.", "Auch Gesicht und Stimme im Meeting waren nicht echt."], "loesung": "Die Ingenieure hatten eine gefälschte Kalendereinladung erhalten. Angreifer hatten sie mit KI im typischen Schreibstil des Teamleiters formuliert und kurz vor den echten Termin gelegt. Im Meeting saß kein echter Mensch, sondern ein KI-generierter Deepfake des Teamleiters, der gezielt Entwicklungsdaten abfragte.", "merksatz": "Auch Einladungen können gefälscht sein. Bei geänderten Terminen oder fremden Meeting-Links lieber kurz beim Absender nachfragen, über einen bekannten Weg."}, "en": {"titel": "The Fake Invitation", "thema": "Phishing, AI, deepfake", "raetsel": "Several engineers miss their weekly team meeting. Instead, they are sitting in a different online meeting, where their “team lead” asks an unusual number of questions about project details.", "tipps": ["The invitation did not come from the team lead.", "The face and voice in the meeting weren't real either."], "loesung": "The engineers had received a fake calendar invitation. Attackers had used AI to write it in the team lead's typical style and scheduled it just before the real meeting. There was no real person in the meeting, only an AI-generated deepfake of the team lead who asked specific questions about development data.", "merksatz": "Invitations can be faked too. If a meeting is moved or the link looks unfamiliar, check with the sender through a channel you already know."}}, {"nr": 5, "stufe": "mittel", "abteilungen": [], "bild": "<metadata><c2pa:

"89\" y=\"30\" class=\"mono red\" font-size=\"12\" text-anchor=\"middle\">test<\/text>", "de": {"titel": "Die Stimme aus dem Off", "thema": "Standardpasswörter, Wahre Begebenheit (Luftfahrt)", "raetsel": "Mitten im Flug erhält ein Pilot Nachrichten im Cockpit, die niemand bei seiner Fluggesellschaft geschickt hat. Der Absender brauchte dafür nur ein einziges Wort, zweimal.", "tipps": ["Nachrichten ans Cockpit laufen über ein Webportal am Boden.", "Das eine Wort ist zugleich Benutzername und Passwort."], "loesung": "Fluggesellschaften nutzen ein zentrales Portal eines Dienstleisters, über das Textnachrichten zwischen Boden und Cockpit laufen, etwa Flugpläne oder technische Daten. Für dieses Portal existierte ein Testzugang mit dem Benutzernamen „test“ und dem Passwort „test“. Wer das ausprobierte, konnte Nachrichten direkt an Piloten senden.", "merksatz": "Test- und Standardzugänge werden vor dem Livebetrieb gelöscht. „test“, „admin“ oder „1234“ probieren Angreifer immer zuerst."}, "en": {"titel": "The Voice from Nowhere", "thema": "Default passwords, true story (aviation)", "raetsel": "In mid-flight, a pilot receives messages in the cockpit that nobody at his airline sent. The sender needed just one single word for this, twice.", "tipps": ["Messages to the cockpit go through a web portal on the ground.", "That one word is both the username and the password."], "loesung": "Airlines use a central portal run by a service provider to send text messages between the ground and the cockpit, such as flight plans or technical data. This portal had a test account with the username “test” and the password “test”. Anyone who tried it could send messages directly to pilots.", "merksatz": "Test and default accounts are deleted before going live. Attackers always try “test”, “admin” or “1234” first."}}, {"nr": 6, "stufe": "leicht", "abteilungen": ["produktion"], "bild": "<metadata><c2pa:

ray=\"4 6\"/>", "de": {"titel": "Der vergessene Laptop", "thema": "Mobile Geräte, Verschlüsselung", "raetsel": "Ein Außendienstmitarbeiter kommt von einer Dienstreise zurück. Das Produkt, das er als Neuheit vorstellen wollte, kennt nun auch die Konkurrenz.", "tipps": ["Der Mitarbeiter hat nichts verraten, er hat etwas verloren.", "Ein Passwort beim Hochfahren schützt nicht alles."], "loesung": "Er hatte seinen Laptop im Zug vergessen. Der Laptop war zwar mit einem Anmeldepasswort geschützt, die Festplatte aber nicht verschlüsselt. Der Finder baute sie aus und konnte alle Daten einfach auslesen. Die Konstruktionsdetails landeten bei einem Wettbewerber.", "merksatz": "Ein Anmeldepasswort schützt nicht die Daten auf der Festplatte, erst eine Verschlüsselung tut das. Verlust sofort der IT melden."}, "en": {"titel": "The Forgotten Laptop", "thema": "Mobile devices, encryption", "raetsel": "A field sales rep returns from a business trip. The product he wanted to present as a novelty is now known to the competition as well.", "tipps": ["The employee didn't give anything away. He lost something.", "A password at startup doesn't protect everything."], "loesung": "He had left his laptop on the train. The laptop was protected with a login password, but the hard drive was not encrypted. The finder removed it and could easily read all the data. The design details ended up with a competitor.", "merksatz": "A login password does not protect the data on the hard drive. Only encryption does. Report a lost device to IT immediately."}}, {"nr": 8, "stufe": "mittel", "abteilungen": [], "bild": "<metadata><c2pa:manifest>AAAWgmp1bWIAAAAeanVtZGMycGEAEQAQgAAAqgA4m3EDYzJwYQAAABZcanVtYgAAAEdqdW1kYzJtYQARABCAAACqADibcQN1cm46YzJwYTozNWE4ZmNiZC0yYjgxLTQ4NDgtYjRiYy0yN2ZjODRjYTdmZGYAAAADl2p1bWIAAAApanVtZGMyYXMAEQAQgAAAqgA4m3EDYzJwYS5hc3NlcnRpb25zAAAAALxqdW1iAAAARGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaW5ncmVkaWVudC52MwAAAAAYYzJzaAc/

4 0 0 1 103.9 36.1\"/><path class=\"r\" d=\"M79.2 31.2 A21 21 0 0 1 108.8 31.2\"/>", "de": {"titel": "Slow Food", "thema": "Smart Home, Updates, Botnetz", "raetsel": "Ein Mann wundert sich, warum sein Internet seit Wochen so langsam ist. Als der Techniker kommt, findet er die Ursache in der Küche.", "tipps": ["Der Kühlschrank ist mit dem Internet verbunden.", "Er arbeitet heimlich für Fremde."], "loesung": "Der smarte Kühlschrank hatte eine veraltete Firmware mit bekannter Sicherheitslücke. Hacker hatten ihn gekapert und zu einem Teil eines Botnetzes gemacht, also eines Verbunds vieler gehackter Geräte. Gemeinsam schickten sie riesige Datenmengen an fremde Webseiten, um diese lahmzulegen (DDoS-Angriff). Dieser Datenverkehr verstopfte das Heimnetz.", "merksatz": "Auch Kühlschrank, Fernseher und Kamera brauchen Updates. Was keine Updates mehr bekommt, gehört nicht ins Internet."}, "en": {"titel": "Slow Food", "thema": "Smart home, updates, botnet", "raetsel": "A man wonders why his internet has been so slow for weeks. When the technician arrives, he finds the cause in the kitchen.", "tipps": ["The fridge is connected to the internet.", "It is secretly working for strangers."], "loesung": "The smart fridge was running outdated firmware with a known security hole. Hackers had taken it over and made it part of a botnet, a network of many hijacked devices. Together they sent huge amounts of data to other websites to knock them offline (a DDoS attack). This traffic clogged up the home network.", "merksatz": "Fridges, TVs and cameras need updates too. Anything that no longer gets updates doesn't belong on the internet."}}, {"nr": 10, "stufe": "mittel", "abteilungen": [], "bild": "<metadata><c2pa:

"mono red\" font-size=\"11\" text-anchor=\"middle\">REC<\/text>", "de": {"titel": "Der gläserne Influencer", "thema": "Webcams, Standardpasswörter", "raetsel": "Ein Influencer bemerkt, dass private Details aus seinem Alltag in einem Forum auftauchen, obwohl er sie nie gepostet hat.", "tipps": ["Jemand schaut tatsächlich zu.", "Das Gerät steht in der Wohnung und wird längst nicht mehr benutzt."], "loesung": "In seiner Wohnung hing noch eine alte Webcam, die er längst vergessen hatte. Sie war weiterhin mit dem WLAN verbunden und mit dem Standardpasswort des Herstellers über das Internet erreichbar. Ein Fan entdeckte sie, beobachtete wochenlang den Alltag des Influencers und veröffentlichte, was er sah.", "merksatz": "Standardpasswörter immer ändern. Geräte, die nicht mehr genutzt werden, vom Netz trennen."}, "en": {"titel": "The See-Through Influencer", "thema": "Webcams, default passwords", "raetsel": "An influencer notices that private details from his daily life are appearing in an online forum, even though he never posted them.", "tipps": ["Someone really is watching.", "The device is in the apartment and hasn't been used for ages."], "loesung": "An old webcam he had long forgotten about was still hanging in his apartment. It was still connected to the Wi-Fi and reachable over the internet with the manufacturer's default password. A fan found it, watched the influencer's daily life for weeks and published what he saw.", "merksatz": "Always change default passwords. Disconnect devices you no longer use."}}, {"nr": 12, "stufe": "mittel", "abteilungen": ["produktion"], "bild": "<metadata><c2pa:

genen Fernzugang zu den Servern eingerichtet. Bei seinem Ausscheiden wurden zwar seine offiziellen Konten gesperrt, von der Hintertür wusste aber niemand. Monate später nutzte er sie, startete eine Verschlüsselungssoftware auf allen Systemen und hinterließ die Nachricht.", "merksatz": "Beim Austritt von Administratoren reicht es nicht, deren Konto zu sperren. Auch gemeinsame Passwörter ändern und Fernzugänge überprüfen."}, "en": {"titel": "Final Regards", "thema": "Offboarding, backdoor, ransomware", "raetsel": "An entire company comes to a standstill. Every screen shows a single sentence: “You forgot about me.”", "tipps": ["The sentence comes from a former employee.", "His official account was blocked, but he still had a second way in."], "loesung": "While working at the company, an administrator had secretly set up his own remote access to the servers. When he left, his official accounts were blocked, but nobody knew about the backdoor. Months later he used it, launched encryption software on all systems and left the message behind.", "merksatz": "When an administrator leaves, blocking their account is not enough. Also change shared passwords and review remote access."}}, {"nr": 16, "stufe": "leicht", "abteilungen": ["buero"], "bild": "<metadata><c2pa:

0 1 0 28 z\"/><path class=\"r\" d=\"M60 62 q26 0 26 24\"/>", "de": {"titel": "Der Chef im Bildschirm", "thema": "Deepfake, CEO-Betrug, Wahre Begebenheit", "raetsel": "Nach einer Videokonferenz mit dem Chef und mehreren Kollegen überweist die Buchhaltung eilig eine große Summe ins Ausland. Später stellt sich heraus: Keiner der Teilnehmer wusste etwas von dem Call.", "tipps": ["Keiner der Kollegen im Call war echt.", "Mit KI kann man Gesicht und Stimme nachmachen."], "loesung": "Bis auf die Buchhaltung waren alle Teilnehmer des Videocalls Deepfakes. Angreifer hatten Gesichter und Stimmen aus öffentlichen Videos mit KI nachgebildet. Der „Chef“ betonte, die Sache sei dringend und streng vertraulich. Ein ähnlicher Fall kostete 2024 ein internationales Ingenieurbüro rund 25 Millionen US-Dollar.", "merksatz": "Bei Zahlungsaufforderungen mit Zeitdruck und Geheimhaltung immer über einen bekannten Weg zurückrufen. Ungewöhnliche Zahlungen brauchen eine zweite Freigabe."}, "en": {"titel": "The Boss on the Screen", "thema": "Deepfake, CEO fraud, true story", "raetsel": "After a video call with the boss and several colleagues, the accounting team urgently transfers a large sum abroad. Later it turns out that none of the participants knew anything about the call.", "tipps": ["None of the colleagues in the call were real.", "AI can imitate faces and voices."], "loesung": "Apart from the accountant, every participant in the video call was a deepfake. Attackers had used AI to recreate faces and voices from public videos. The “boss” stressed that the matter was urgent and strictly confidential. A similar case cost an international engineering firm around 25 million US dollars in 2024.", "merksatz": "For payment requests with time pressure and secrecy, always call back through a channel you know. Unusual payments need a second approval."}}, {"nr": 18, "stufe": "schwer", "abteilungen": ["fuehrung"], "bild": "<metadata><c2pa:

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPZYQFeOgXVeUEk4WkhJsv5l8L3jFIvU0UKBjPgaMmiHKrerPPSD24aC+1TnQJuEM5HiWW7hPqIQdYneQ04f1qjMfNU=<\/c2pa:manifest><\/metadata><rect class=\"k\" x=\"18\" y=\"16\" width=\"84\" height=\"88\" rx=\"12\"/><path class=\"r\" style=\"stroke-width:6\" d=\"M44 42 a26 26 0 1 0 32 0 M60 30 v30\"/>", "de": {"titel": "Ohne mich geht nichts", "thema": "Innentäter, Sabotage", "raetsel": "Als einem Mitarbeiter Zuständigkeiten entzogen werden, stürzen plötzlich immer wieder Server ab. Am Tag nach seiner Kündigung kann sich niemand mehr im Unternehmen anmelden.", "tipps": ["Der Mitarbeiter hat die Probleme selbst verursacht, aus Frust.", "Ein Programm wartete darauf, dass sein Konto gesperrt wird."], "loesung": "Aus Frust hatte der Entwickler eigene Schadsoftware auf den Servern versteckt, die sie immer wieder überlastete. Zusätzlich baute er einen „Kill Switch“ ein: ein Programm, das prüfte, ob sein Konto noch aktiv ist. Als sein Konto nach der Kündigung gesperrt wurde, sperrte das Programm automatisch die Konten aller anderen Mitarbeiter.", "merksatz": "Kritische Änderungen an Systemen sollte nie eine Person allein vornehmen können. Vier-Augen-Prinzip und regelmäßige Kontrollen schützen auch vor Innentätern."}, "en": {"titel": "Nothing Works Without Me", "thema": "Insider, sabotage", "raetsel": "When an employee has responsibilities taken away from him, servers suddenly keep crashing. The day after he is fired, nobody in the company can log in any more.", "tipps": ["The employee caused the problems himself, out of frustration.", "A program was waiting for his account to be blocked."], "loesung": "Out of frustration, the developer had hidden his own malware on the servers, which overloaded them again and again. He also built a “kill switch”: a program that checked whether his account was still active. When his account was blocked after his dismissal, the program automatically locked the accounts of all other employees.", "merksatz": "No single person should be able to make critical changes to systems alone. The four-eyes principle and regular checks also protect against insiders."}}, {"nr": 20, "stufe": "mittel", "abteilungen": [], "bild": "<metadata><c2pa:

", "raetsel": "Montagmorgen: In der Buchhaltung öffnet jemand eine Rechnung. Am Mittwoch stehen im ganzen Werk die Bänder still.", "tipps": ["Die Rechnung war eine E-Mail mit Anhang.", "Der Anhang wollte, dass man etwas „aktiviert“."], "loesung": "Die „Rechnung“ kam per E-Mail von einem angeblichen Lieferanten mit dem Betreff „Letzte Mahnung“. Der Anhang war ein Office-Dokument, das zum Anzeigen aufforderte, „Inhalte zu aktivieren“. Damit startete eine Schadsoftware, die sich zwei Tage lang unbemerkt im Netz ausbreitete und dann alle Server samt Produktionsplanung verschlüsselte.", "merksatz": "Bei unerwarteten Anhängen und Zeitdruck misstrauisch werden. Niemals „Inhalte aktivieren“, wenn man nicht sicher ist, woher die Datei kommt."}, "en": {"titel": "The Urgent Invoice", "thema": "Phishing, ransomware", "raetsel": "Monday morning: someone in accounting opens an invoice. By Wednesday, every production line in the plant has stopped.", "tipps": ["The invoice was an email with an attachment.", "The attachment wanted something to be “enabled”."], "loesung": "The “invoice” arrived by email from a supposed supplier with the subject line “Final reminder”. The attachment was an Office document that asked the reader to “enable content” to view it. That launched malware, which spread unnoticed through the network for two days and then encrypted all the servers, including production planning.", "merksatz": "Be suspicious of unexpected attachments and time pressure. Never click “enable content” unless you are sure where the file came from."}}, {"nr": 22, "stufe": "mittel", "abteilungen": ["einkauf"], "bild": "<metadata><c2pa:

work is in someone else's hands.", "tipps": ["The phone was showing login requests.", "The attackers already knew his password. All they needed was his “Yes”."], "loesung": "The attackers already knew his password. All they were missing was the confirmation in the app (two-factor login). So they kept triggering login attempts until the employee approved one of them, just to get some peace. In 2022, attackers got into the network of a large ride-hailing company in a similar way.", "merksatz": "Only approve logins you have just started yourself. Report unexpected requests to IT immediately: they mean your password is already known."}}, {"nr": 25, "stufe": "leicht", "abteilungen": ["buero"], "bild": "<metadata><c2pa:manifest>AAAWgmp1bWIAAAAeanVtZGMycGEAEQAQgAAAqgA4m3EDYzJwYQAAABZcanVtYgAAAEdqdW1kYzJtYQARABCAAACqADibcQN1cm46YzJwYToyNDdiNTRhMC1kNzg5LTQyOTMtYjI3MS1lOGVhNTVlNDhhM2UAAAADl2p1bWIAAAApanVtZGMyYXMAEQAQgAAAqgA4m3EDYzJwYS5hc3NlcnRpb25zAAAAALxqdW1iAAAARGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaW5ncmVkaWVudC52MwAAAAAYYzJzaDZsU5+NRH+WrK8NvOKZ+t0AAABwY2JvcqNpZGM6Zm9ybWF0bWltYWdlL3N2Zyt4bWxqaW5zdGFuY2VJRHgseG1wOmlpZDpiN2Q3MmNjNy0yOTZjLTQ1MWEtOGYzOS02Y2M5ZDNkMjhmZWVscmVsYXRpb25zaGlwaHBhcmVudE9mAAAB4mp1bWIAAABBanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5hY3Rpb25zLnYyAAAAABhjMnNow1zbUTMJNbxPeLrv5XI9vAAAAZljYm9yomdhY3Rpb25zgqJmYWN0aW9ua2MycGEub3BlbmVkanBhcmFtZXRlcnOha2luZ3JlZGllbnRzgaJjdXJseC1zZWxmI2p1bWJmPWMycGEuYXNzZXJ0aW9ucy9jMnBhLmluZ3JlZGllbnQudjNkaGFzaFggkTUlJQ1LxSpfUVWHsgpQ9OHg3AsgKiTjMSjVytvMnAmkZmFjdGlvbngdY29tLmFudGhyb3BpYy5jbGF1ZGUucHJvdmlkZWRqcGFyYW1ldGVyc6F4H2NvbS5hbnRocm9waWMub3JpZ2luLWNvbmZpZGVuY2VndW5rbm93bmtkZXNjcmlwdGlvbnhmQ2xhdWRlIHByb3ZpZGVkIHRoaXMgZmlsZSBhdCB0aGUgcmVxdWVzdCBvZiBhIHVzZXIgYW5kIG1heSBoYXZlIGNyZWF0ZWQgb3IgbW9kaWZpZWQgdGhlIGZpbGUgY29udGVudHMubXNvZnR3YXJlQWdlbnShZG5hbWVmQ2xhdWRlcmFsbEFjdGlvbnNJbmNsdWRlZPUAAADIanVtYgAAAEBqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmhhc2guZGF0YQAAAAAYYzJzaH8mbWKn00UZjtvC6THu1r4AAACAY2JvcqVjYWxnZnNoYTI1NmNwYWRNAAAAAAAAAAAAAAAAAGRoYXNo

beitet wie immer an seinen Angeboten. Am nächsten Tag unterbietet ein Mitbewerber sein Angebot auf den Euro genau.", "tipps": ["Der Fehler passierte bei der Verbindung mit dem Internet.", "Nicht jedes WLAN mit dem Namen des Hotels gehört auch dem Hotel."], "loesung": "In der Lobby gab es zwei WLANs mit fast gleichem Namen. Eines davon hatte ein Angreifer mit einem kleinen Gerät aufgespannt. Weil der Vertriebler sich ohne VPN verband, konnte der Angreifer den Datenverkehr mitlesen und sich in sein Webmail-Konto einloggen.", "merksatz": "In öffentlichen WLANs immer das Firmen-VPN nutzen, oder besser den Hotspot des eigenen Diensthandys."}, "en": {"titel": "Free Wi-Fi", "thema": "Public Wi-Fi, travel", "raetsel": "A sales rep sits in a hotel lobby working on his quotes as usual. The next day, a competitor undercuts his offer to the exact euro.", "tipps": ["The mistake happened when he connected to the internet.", "Not every Wi-Fi network with the hotel's name belongs to the hotel."], "loesung": "There were two Wi-Fi networks in the lobby with almost the same name. An attacker had set one of them up with a small device. Because the sales rep connected without a VPN, the attacker could read his traffic and log into his webmail account.", "merksatz": "On public Wi-Fi always use the company VPN, or better still, your work phone's hotspot."}}, {"nr": 30, "stufe": "mittel", "abteilungen": ["vertrieb"], "bild": "<metadata><c2pa:

8 14 M60 94 l8 14\"/><path class=\"r\" d=\"M80 44 q8 10 0 20 M90 36 q14 18 0 36 M100 28 q20 26 0 52\"/>", "de": {"titel": "Das Telefonat im ICE", "thema": "Vertraulichkeit unterwegs, Social Engineering", "raetsel": "Ein Projektleiter fährt mit dem Zug nach Hause. Am nächsten Tag ruft ein „Kollege aus der IT“ bei seiner Assistentin an, und sie hilft ihm gern.", "tipps": ["Der Anrufer wusste Dinge, die nur Insider wissen.", "Das Wissen stammt aus dem Zug."], "loesung": "Der Projektleiter hatte im Zug laut telefoniert: Projektname, Kundenname, Namen seines Teams und dass er morgen im Urlaub ist. Ein Mitreisender schrieb mit. Mit diesem Wissen klang sein Anruf bei der Assistentin so glaubwürdig, dass sie ihm die Zugangsdaten zum Projektlaufwerk durchgab.", "merksatz": "In der Öffentlichkeit hören immer andere mit. Vertrauliche Gespräche und Bildschirme gehören nicht in Zug, Café oder Wartebereich."}, "en": {"titel": "The Call on the Train", "thema": "Confidentiality on the move, social engineering", "raetsel": "A project manager takes the express train home. The next day, a “colleague from IT” calls his assistant, and she is happy to help him.", "tipps": ["The caller knew things only insiders know.", "The knowledge came from the train."], "loesung": "On the train, the project manager had made a loud phone call: project name, customer name, the names of his team, and that he would be on vacation the next day. A fellow passenger took notes. With that knowledge, his call to the assistant sounded so convincing that she gave him the login details for the project drive.", "merksatz": "In public, others are always listening. Confidential calls and screens don't belong on trains, in cafés or in waiting areas."}}, {"nr": 31, "stufe": "leicht", "abteilungen": ["buero"], "bild": "<metadata><c2pa:

    answersHead: "Erlaubte Antworten",
    answers: [["Ja", ""], ["Nein", ""], ["Unwichtig", "spielt für die Lösung keine Rolle"], ["Teilweise", "halb richtig"]],
    gmHead: "Tipps für die Spielleitung",
    gm: [
      "Lies die Lösung vor dem Spiel. Dafür gibt es den Spickzettel im Bedienfeld, öffne ihn aber nicht, während der Bildschirm für alle sichtbar ist.",
      "Bewerte großzügig und sag ruhig „Teilweise“, wenn die Gruppe nah dran ist. Es geht nicht darum, wer sich mit IT auskennt.",
      "Nach etwa zehn Minuten ohne Fortschritt beide Tipps geben und dann auflösen. Die Zeitanzeige wird ab zehn Minuten rot.",
      "<b>Wettbewerb:</b> Mehrere Teams spielen dieselbe Karte. Gewonnen hat das Team mit den wenigsten Fragen, jeder Tipp zählt als fünf Fragen.",
    ],
    toCards: "Zu den Karten",
  },
  en: {
    navCards: "Cards", navRules: "Rules",
    eyebrowCards: n => `Game master · ${n} cards`, headCards: "Which incident will we solve today?",
    level: "Difficulty", group: "Audience", all: "All",
    levels: { leicht: "Easy", mittel: "Medium", schwer: "Hard" },
    groups: { produktion: "Production", buero: "Office", einkauf: "Purchasing and accounting", vertrieb: "Sales and field service", fuehrung: "Management and IT" },
    random: "Random card", resetPlayed: "Reset played",
    countNote: (a, b, p) => `${a} of ${b} cards` + (p ? ` · ${p} already played` : ""),
    riddle: "RIDDLE", solution: "SOLUTION", played: "Played", allCards: "← All cards",
    cardLabel: "Riddle card", panelLabel: "Game master controls",
    questions: "Questions asked", minusQ: "Remove one question", plusQ: "+ Question",
    time: "Time", space: "Space", start: "Start", pause: "Pause", resume: "Resume", resetTime: "Reset time",
    tips: "Hints", ofN: (a, b) => `${a} of ${b}`, tip: i => `Hint ${i}`, showTip: i => `Show hint ${i}`,
    reveal: "Reveal solution", peekOpen: "Cheat sheet for the game master", peekClose: "Hide cheat sheet",
    peekWarn: "<b>For your eyes only.</b> Don't open this on the projector.",
    prev: "← Previous", next: "Next →",
    keys: "Keys: <kbd>F</kbd> count question · <kbd>T</kbd> hint · <kbd>L</kbd> solution · <kbd>Space</kbd> timer · <kbd>←</kbd> <kbd>→</kbd> switch card",
    stats: (q, t, time) => `${q} ${q === 1 ? "question" : "questions"} · ${t} ${t === 1 ? "hint" : "hints"} · ${time}`,
    takeaway: "Key takeaway", debrief: "Debrief",
    debriefQs: ["Could this happen here too?", "How could the incident have been spotted earlier?", "Who do we call if we notice something like this?"],
    fallback: "Only available in German", fallbackShort: "DE only", difficulty: "Difficulty",
    rulesEyebrow: "How to play", rulesHead: "Rules",
    steps: [
      ["Pick a card", "The game master picks a card and reads out the title and riddle. The riddle is shown large on screen, the solution stays hidden."],
      ["Ask questions", "The group asks questions that can be answered with yes or no. The game master keeps count."],
      ["Give hints", "If the group is stuck for a few minutes, the game master reveals the first hint, later the second one."],
      ["Solve", "A card is solved when the group names the core of it: what happened and which mistake made it possible."],
      ["Reveal and discuss", "Reveal the solution and the key takeaway, then discuss together whether this could happen here too. This part may take as long as the guessing."],
    ],
    answersHead: "Allowed answers",
    answers: [["Yes", ""], ["No", ""], ["Irrelevant", "doesn't matter for the solution"], ["Partly", "half right"]],
    gmHead: "Tips for the game master",
    gm: [
      "Read the solution before the game. Use the cheat sheet in the controls for that, but don't open it while the screen is visible to everyone.",
      "Be generous and say “Partly” when the group is close. This is not about who knows the most about IT.",
      "After about ten minutes without progress, give both hints and then reveal the solution. The timer turns red after ten minutes.",
      "<b>Competition:</b> Several teams play the same card. The team with the fewest questions wins; each hint counts as five questions.",
    ],
    toCards: "Go to cards",
  },
};
const STARS = { leicht: 1, mittel: 2, schwer: 3 };
const LEVEL_KEYS = ["leicht", "mittel", "schwer"];
const KNOWN_GROUPS = ["produktion", "buero", "einkauf", "vertrieb", "fuehrung"];
const usedGroups = new Set(CARDS.flatMap(c => c.abteilungen));
const GROUP_KEYS = [...KNOWN_GROUPS.filter(k => usedGroups.has(k)), ...[...usedGroups].filter(k => !KNOWN_GROUPS.includes(k)).sort()];

const store = {
  get(k, d) { try { const v = localStorage.getItem("cyberstories:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cyberstories:" + k, JSON.stringify(v)); } catch (e) {} },
};

const browserLang = (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en";
let S = {
  lang: store.get("lang", browserLang), view: "cards", level: "alle", group: "alle", nr: null,
  questions: 0, tipsShown: 0, solved: false, peek: false,
  timer: 0, running: false, played: store.get("played", []),
};
if (!T[S.lang]) S.lang = "de";
let tick = null;
const L = () => T[S.lang];

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => s.split(/\n\s*\n/).map(p => "<p>" + esc(p.trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>") + "</p>").join("");
const svg = c => `<svg viewBox="0 0 120 120" aria-hidden="true">${c.bild}</svg>`;
const groupLabel = k => L().groups[k] || (k.charAt(0).toUpperCase() + k.slice(1));
const stars = lvl => `<span class="stars" title="${L().difficulty}: ${L().levels[lvl]}">${[1, 2, 3].map(i => `<i class="${i <= STARS[lvl] ? "" : "off"}"></i>`).join("")}<em>${L().levels[lvl]}</em></span>`;
const pad = n => String(n).padStart(2, "0");
const fmt = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
const card = nr => CARDS.find(c => c.nr === nr);
// Text der Karte in der gewählten Sprache, sonst in der anderen Sprache mit Hinweis.
const txt = c => c[S.lang] ? { ...c[S.lang], fallback: false } : { ...(c.de || c.en), fallback: true };

function filtered() {
  return CARDS.filter(c => (S.level === "alle" || c.stufe === S.level) && (S.group === "alle" || c.abteilungen.includes(S.group)));
}

function go(view, extra = {}) {
  Object.assign(S, { view }, extra);
  render();
  window.scrollTo({ top: 0 });
}

function startCard(nr) {
  stopTimer();
  go("play", { nr, questions: 0, tipsShown: 0, solved: false, peek: false, timer: 0, running: false });
}

function startTimer() {
  if (S.running) return;
  S.running = true;
  tick = setInterval(() => { S.timer++; const n = $("#timer-num"); if (n) { n.textContent = fmt(S.timer); n.classList.toggle("warn", S.timer >= 600); } }, 1000);
  updateTimerBtn();
}
function stopTimer() { S.running = false; clearInterval(tick); tick = null; updateTimerBtn(); }
function updateTimerBtn() { const b = $("#timer-toggle"); if (b) b.textContent = S.running ? L().pause : (S.timer ? L().resume : L().start); }

function markPlayed(nr) {
  if (!S.played.includes(nr)) { S.played.push(nr); store.set("played", S.played); }
}

function viewCards() {
  const t = L(), list = filtered();
  const chip = (key, k, label) => `<button type="button" class="chip" id="f-${key}-${k}" data-f="${key}" data-v="${k}" aria-pressed="${S[key] === k}">${esc(label)}</button>`;
  return `
    <p class="eyebrow">${t.eyebrowCards(CARDS.length)}</p>
    <h1 class="page">${t.headCards}</h1>
    <div class="rule"></div>
    <div class="filters">
      <div class="fgroup"><span>${t.level}</span><div class="chips">${chip("level", "alle", t.all)}${LEVEL_KEYS.map(k => chip("level", k, t.levels[k])).join("")}</div></div>
      <div class="fgroup"><span>${t.group}</span><div class="chips">${chip("group", "alle", t.all)}${GROUP_KEYS.map(k => chip("group", k, groupLabel(k))).join("")}</div></div>
      <div class="fgroup"><span>&nbsp;</span><div class="chips">
        <button type="button" class="btn red" id="random" ${list.length ? "" : "disabled"}>${t.random}</button>
        ${S.played.length ? `<button type="button" class="btn" id="reset-played">${t.resetPlayed}</button>` : ""}
      </div></div>
    </div>
    <p class="count-note">${t.countNote(list.length, CARDS.length, S.played.length)}</p>
    <div class="grid">${list.map(c => { const x = txt(c); const p = S.played.includes(c.nr); return `
      <button type="button" class="tile${p ? " is-played" : ""}" data-nr="${c.nr}" id="tile-${c.nr}">
        <span class="tile-bar"><span>${t.riddle}</span><b>#${pad(c.nr)}</b></span>
        <span class="art">${svg(c)}</span>
        <span class="tile-body">
          <span class="tile-title">${esc(x.titel)}</span>
          <span class="tile-meta">${stars(c.stufe)}${x.fallback ? `<span class="fallback">${t.fallbackShort}</span>` : ""}${p ? `<span class="played">${t.played}</span>` : ""}</span>
        </span>
      </button>`; }).join("")}
    </div>`;
}

function viewPlay() {
  const t = L(), c = card(S.nr), x = txt(c);
  const list = filtered();
  const idx = list.findIndex(y => y.nr === c.nr);
  const tips = x.tipps.slice(0, S.tipsShown).map((tp, i) => `<div class="tip reveal"><span class="tip-label">${t.tip(i + 1)}</span>${esc(tp)}</div>`).join("");
  const nextTip = S.tipsShown < x.tipps.length
    ? `<button type="button" class="btn tipbtn" id="tip"><span>${t.showTip(S.tipsShown + 1)}</span><kbd>T</kbd></button>` : "";
  return `
    <div class="backrow">
      <button type="button" class="linkbtn" id="back">${t.allCards}</button>
      <span>${stars(c.stufe)}</span>
    </div>
    <div class="play">
      <article class="bigcard" aria-label="${t.cardLabel}">
        <div class="tile-bar"><span>CYBER<b style="font-size:inherit">STORIES</b></span><b>#${pad(c.nr)}</b></div>
        <div class="art">${svg(c)}</div>
        <div class="bigcard-body">
          ${x.fallback ? `<span class="fallback">${t.fallback}</span>` : ""}
          <h2>${esc(x.titel)}</h2>
          <div class="rule"></div>
          <div class="riddle">${md(x.raetsel)}</div>
        </div>
      </article>
      <aside class="panel" aria-label="${t.panelLabel}">
        <div class="box">
          <p class="box-h"><span>${t.questions}</span><span><kbd>F</kbd></span></p>
          <div class="counter">
            <button type="button" class="btn" id="q-minus" aria-label="${t.minusQ}">−</button>
            <span class="num" id="q-num" aria-live="polite">${S.questions}</span>
            <button type="button" class="btn solid plus" id="q-plus">${t.plusQ}</button>
          </div>
        </div>
        <div class="box">
          <p class="box-h"><span>${t.time}</span><span><kbd>${t.space}</kbd></span></p>
          <div class="timer">
            <span class="num${S.timer >= 600 ? " warn" : ""}" id="timer-num">${fmt(S.timer)}</span>
            <span class="btns">
              <button type="button" class="btn solid" id="timer-toggle"></button>
              <button type="button" class="btn" id="timer-reset" aria-label="${t.resetTime}">↺</button>
            </span>
          </div>
        </div>
        <div class="box">
          <p class="box-h"><span>${t.tips}</span><span>${t.ofN(S.tipsShown, x.tipps.length)}</span></p>
          <div class="tips">${tips}${nextTip}</div>
        </div>
        ${S.solved ? "" : `<button type="button" class="btn red" id="solve">${t.reveal} <kbd>L</kbd></button>`}
        <div>
          <button type="button" class="linkbtn" id="peek" aria-expanded="${S.peek}">${S.peek ? t.peekClose : t.peekOpen}</button>
          ${S.peek && !S.solved ? `<div class="peek"><p>${t.peekWarn}</p>${md(x.loesung)}</div>` : ""}
        </div>
        <div class="navrow">
          <button type="button" class="btn" id="prev" ${idx > 0 ? "" : "disabled"}>${t.prev}</button>
          <button type="button" class="btn" id="next" ${idx >= 0 && idx < list.length - 1 ? "" : "disabled"}>${t.next}</button>
        </div>
        <p class="hint-keys">${t.keys}</p>
      </aside>
    </div>
    ${S.solved ? `
    <section class="solution reveal" id="solution" aria-label="${t.solution}">
      <div class="tile-bar"><span>${t.solution}</span><b>${t.stats(S.questions, S.tipsShown, fmt(S.timer))}</b></div>
      <div class="sol-body">
        <div class="sol-text">${md(x.loesung)}</div>
        <div>
          <div class="merk"><span class="tip-label">${t.takeaway}</span>${md(x.merksatz)}</div>
          <div class="talk">
            <p class="box-h"><span>${t.debrief}</span></p>
            <ol>${t.debriefQs.map(q => `<li>${q}</li>`).join("")}</ol>
          </div>
        </div>
      </div>
    </section>` : ""}`;
}

function viewRules() {
  const t = L();
  return `
    <p class="eyebrow">${t.rulesEyebrow}</p>
    <h1 class="page">${t.rulesHead}</h1>
    <div class="rule"></div>
    <div class="rules">
      <ol class="steps">${t.steps.map(([h, b]) => `<li><div><b>${h}</b>${b}</div></li>`).join("")}</ol>
      <div class="prose">
        <p class="box-h"><span>${t.answersHead}</span></p>
        <div class="answers">${t.answers.map(([a, d]) => `<div>${a}${d ? `<span>${d}</span>` : ""}</div>`).join("")}</div>
        <p class="box-h" style="margin-top:26px"><span>${t.gmHead}</span></p>
        ${t.gm.map(p => `<p>${p}</p>`).join("")}
        <button type="button" class="btn solid" id="to-cards" style="margin-top:8px">${t.toCards}</button>
      </div>
    </div>`;
}

function render() {
  const t = L();
  document.documentElement.lang = S.lang;
  $("#nav-cards").textContent = t.navCards;
  $("#nav-rules").textContent = t.navRules;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  $("#app").innerHTML = S.view === "play" && S.nr && card(S.nr) ? viewPlay() : S.view === "rules" ? viewRules() : viewCards();
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", String(b.dataset.view === S.view || (S.view === "play" && b.dataset.view === "cards"))));
  updateTimerBtn();
}

function act(id) {
  const c = S.nr && card(S.nr);
  const list = filtered();
  const idx = c ? list.findIndex(x => x.nr === c.nr) : -1;
  switch (id) {
    case "q-plus": S.questions++; if (!S.running && !S.solved) startTimer(); $("#q-num").textContent = S.questions; return;
    case "q-minus": S.questions = Math.max(0, S.questions - 1); $("#q-num").textContent = S.questions; return;
    case "timer-toggle": S.running ? stopTimer() : startTimer(); return;
    case "timer-reset": stopTimer(); S.timer = 0; $("#timer-num").textContent = fmt(0); $("#timer-num").classList.remove("warn"); updateTimerBtn(); return;
    case "tip": if (S.tipsShown < txt(c).tipps.length) { S.tipsShown++; render(); } return;
    case "solve": S.solved = true; S.peek = false; stopTimer(); markPlayed(c.nr); render(); setTimeout(() => $("#solution")?.scrollIntoView({ behavior: "smooth", block: "start" }), 50); return;
    case "peek": S.peek = !S.peek; render(); return;
    case "prev": if (idx > 0) startCard(list[idx - 1].nr); return;
    case "next": if (idx >= 0 && idx < list.length - 1) startCard(list[idx + 1].nr); return;
    case "back": case "home": case "to-cards": stopTimer(); go("cards"); return;
    case "random": {
      const fresh = list.filter(x => !S.played.includes(x.nr));
      const pool = fresh.length ? fresh : list;
      if (pool.length) startCard(pool[Math.floor(Math.random() * pool.length)].nr);
      return;
    }
    case "reset-played": S.played = []; store.set("played", []); render(); return;
  }
}

document.addEventListener("click", e => {
  const lg = e.target.closest(".lang button");
  if (lg) { S.lang = lg.dataset.lang; store.set("lang", S.lang); render(); return; }
  const nav = e.target.closest(".nav button");
  if (nav) { stopTimer(); go(nav.dataset.view); return; }
  const f = e.target.closest("[data-f]");
  if (f) { S[f.dataset.f] = f.dataset.v; store.set("filters", { level: S.level, group: S.group }); render(); return; }
  const tl = e.target.closest(".tile");
  if (tl) { startCard(+tl.dataset.nr); return; }
  const b = e.target.closest("button[id]");
  if (b) act(b.id);
});

document.addEventListener("keydown", e => {
  if (S.view !== "play" || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest("input, textarea")) return;
  const k = e.key.toLowerCase();
  const map = { f: "q-plus", "+": "q-plus", "-": "q-minus", t: "tip", l: "solve", arrowleft: "prev", arrowright: "next", escape: "back" };
  if (e.key === " ") { e.preventDefault(); act("timer-toggle"); return; }
  if (map[k]) { if (k === "l" && S.solved) return; e.preventDefault(); act(map[k]); }
});

function start(data) {
  const f = store.get("filters", null);
  if (f) {
    S.level = f.level === "alle" || LEVEL_KEYS.includes(f.level) ? f.level : "alle";
    S.group = f.group === "alle" || GROUP_KEYS.includes(f.group) ? f.group : "alle";
  }
  if (data && data.view) { Object.assign(S, data, { running: false, played: store.get("played", []) }); }
  render();
  if (data && data.wasRunning) startTimer();
}
window.claude?.hot?.snapshot?.(() => ({ lang: S.lang, view: S.view, level: S.level, group: S.group, nr: S.nr, questions: S.questions,
  tipsShown: S.tipsShown, solved: S.solved, peek: S.peek, timer: S.timer, wasRunning: S.running }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
